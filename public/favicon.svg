<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- LAYER 1: Back Arc of Orbital Ring (Goes BEHIND the book on the left) -->
  <path
    d="M 29 14 A 13 5.5 0 0 0 3 14"
    stroke="#1A362B"
    stroke-width="1.4"
    stroke-opacity="0.9"
    stroke-linecap="round"
    fill="none"
    transform="rotate(-15 16 14)"
  />

  <!-- LAYER 2: Solid Gold Open Book Folio in MIDDLE -->
  <path d="M16 20C13 18 8 18 5 19V9C8 8 13 8 16 10V20Z" fill="#F4C300" />
  <path d="M16 20C19 18 24 18 27 19V9C24 8 19 8 16 10V20Z" fill="#E5B200" />
  <line x1="16" y1="10" x2="16" y2="20" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" />

  <!-- LAYER 3: Front Arc of Orbital Ring (Goes IN FRONT of the book on the right) -->
  <path
    d="M 3 14 A 13 5.5 0 0 0 29 14"
    stroke="#1A362B"
    stroke-width="1.4"
    stroke-opacity="0.9"
    stroke-linecap="round"
